<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .alertaError {
            background-color: #ffdddd;
            color: #d8000c;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 1px solid #d8000c;
        }
        .tabla {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .tabla th, .tabla td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        .tabla th {
            background-color: #007bff;
            color: white;
        }
        .tabla tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .tabla tr:hover {
            background-color: #ddd;
        }
        .text-center {
            text-align: center;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mis Reservas</h1>
        <div id="error-message" class="alertaError" style="display: none;"></div>
        <table class="tabla">
            <thead>
                <tr>
                    <th>ID Reserva</th>
                    <th>Evento</th>
                    <th>Entradas</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="reservas-tbody">
                <tr>
                    <td colspan="4" class="text-center">Cargando reservas...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                document.getElementById('error-message').textContent = 'Error: No estás autenticado. Inicia sesión.';
                document.getElementById('error-message').style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/reservas/', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Token ' + token,
                        'Content-Type': 'application/json',
                    },
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        alert('Tu sesión ha expirado. Inicia sesión nuevamente.');
                        localStorage.removeItem('token');
                        window.location.href = '/login';
                    } else {
                        alert('Error al cargar reservas.');
                    }
                    return;
                }

                const data = await response.json();
                renderReservas(data.reservas);
            } catch (error) {
                console.error('Error al obtener reservas:', error);
                alert('No se pudieron cargar las reservas.');
            }
        });

        function renderReservas(reservas) {
            const tableBody = document.getElementById('reservas-tbody');
            if (!reservas || reservas.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center">No tienes reservas actualmente.</td></tr>`;
                return;
            }

            tableBody.innerHTML = reservas.map(reserva => `
                <tr>
                    <td>${reserva.id}</td>
                    <td>${reserva.evento}</td>
                    <td>${reserva.entradas_reservadas}</td>
                    <td>${reserva.estado}</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
