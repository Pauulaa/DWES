{% extends 'base.html' %}
{% load static %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="login-container">
    <h1>Iniciar Sesión</h1>

    <form id="login-form" method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
        </div>

        <button type="submit">Iniciar Sesión</button>

        <p id="error-message" class="error"></p>
    </form>
</div>

<script>
document.getElementById("login-form").addEventListener("submit", async function (event) {
    event.preventDefault(); // Evita el envío tradicional del formulario

    const formData = new FormData(this);
    const csrfToken = formData.get('csrfmiddlewaretoken'); // Obtener token CSRF

    try {
        const response = await fetch("http://127.0.0.1:8000/login-api/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken // Agregar CSRF Token
            },
            body: JSON.stringify({
                username: formData.get("username"),
                password: formData.get("password")
            })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem("token", data.token); // Guardar token
            alert("Inicio de sesión exitoso");
            window.location.href = "/inicio/"; // Redirigir
        } else {
            const errorText = await response.json();
            document.getElementById("error-message").innerText = errorText.error || "Error al iniciar sesión.";
        }
    } catch (error) {
        console.error("Error en la solicitud:", error);
        document.getElementById("error-message").innerText = "Error de conexión con el servidor.";
    }
});
</script>
{% endblock %}
