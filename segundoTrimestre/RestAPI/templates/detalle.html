<!DOCTYPE html>
<html>
<head>
    <title>Detalles del Evento</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #007bff;
            margin-top: 20px;
            font-size: 2.5em;
        }

        body > *:not(h1) {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        p img {
            display: block;
            margin: 20px auto;
            max-width: 500px;
            height: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        p {
            font-size: 1em;
            line-height: 1.6;
            margin: 10px 0;
        }

        p strong {
            color: #007bff;
        }

        form {
            margin-top: 30px;
        }

        form label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #555;
        }

        form input {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }

        form button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
            display: block;
            width: 100%;
        }

        form button:hover {
            background-color: #0056b3;
        }

        button a {
            text-decoration: none;
            color: white;
        }

        p a {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 1em;
            color: #007bff;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>{{ eventos.titulo }}</h1>
    <p><img src="{{ eventos.imagen_url }}"/></p>
    <p><strong>Fecha:</strong> {{ eventos.fecha_hora }}</p>
    <p><strong>Descripción:</strong> {{ eventos.descripcion }}</p>

    <h2>Reserva tu lugar</h2>
    <form id="reserve-form">
        {% csrf_token %}
        <label for="nombre">Tu Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="email">Tu Correo Electrónico:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="cantidad">Cantidad de Boletos:</label>
        <input type="number" id="cantidad" name="cantidad" required><br><br>

        <button type="submit">Reservar</button>
    </form>

    <p><a href="{% url 'listar_eventos' %}">Volver a la lista de eventos</a></p>

    <script>
        document.getElementById("reserve-form").addEventListener("submit", async function (event) {
            event.preventDefault();

            const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            const token = localStorage.getItem("token");

            if (!token) {
                alert("Por favor, inicia sesión antes de realizar una reserva.");
                return;
            }

            const eventoID = "{{ eventos.id }}";
            const entradas = document.getElementById('cantidad').value;

            try {
                const response = await fetch("/reservas/crear/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": 'Token ' + token,
                        "X-CSRFToken": csrftoken
                    },
                    body: JSON.stringify({
                        entradas_reservadas: parseInt(entradas, 10),
                        evento_id: eventoID
                    }),
                });

                if (response.ok) {
                    alert("Reserva Exitosa.");
                    window.location.href = "/panel_usuario/";
                } else {
                    const errorData = await response.json();
                    alert(errorData.error || "Error desconocido al realizar la reserva.");
                }
            } catch (error) {
                alert("Error de conexión con el servidor.");
                console.error("Error:", error);
            }
        });
    </script>
</body>
</html>
